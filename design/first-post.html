<!doctype html>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1350px;overflow:hidden}
body{position:relative;background:#f5f9ff;color:#0d2340;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;padding:56px 64px}
.head{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px;font-weight:900;font-size:30px}
.logo{width:62px;height:62px;border-radius:50%;object-fit:cover}
.seq{font:800 18px ui-monospace,SFMono-Regular,Menlo,monospace;color:#1467e8;letter-spacing:.08em}
.kicker{margin-top:45px;color:#1467e8;font:900 20px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}
.destination{margin:10px 0 0;font-weight:950;font-size:48px;line-height:1;letter-spacing:-.05em}
.date-ticket{position:relative;margin-top:28px;background:#1467e8;color:#fff;border-radius:30px;padding:35px 42px 38px;overflow:hidden;box-shadow:0 24px 55px rgba(20,103,232,.22)}
.date-ticket:before,.date-ticket:after{content:"";position:absolute;top:132px;width:34px;height:34px;border-radius:50%;background:#f5f9ff}
.date-ticket:before{left:-17px}.date-ticket:after{right:-17px}
.year{font:900 22px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:#cfe1ff}
.dates{display:flex;align-items:center;gap:20px;margin-top:8px;font:950 97px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.09em;white-space:nowrap}
.arrow{font-size:54px;color:#ffd43b;letter-spacing:0}
.duration{display:flex;align-items:center;gap:18px;margin-top:28px;padding-top:27px;border-top:2px dashed rgba(255,255,255,.45)}
.duration strong{font-size:35px}.duration span{font-size:21px;color:#dce9ff}
.ticket{margin-top:28px;background:#fff;border:2px solid #cbdcf1;border-radius:27px;overflow:hidden;box-shadow:0 20px 48px rgba(13,35,64,.1)}
.fare{display:flex;align-items:end;justify-content:space-between;padding:29px 38px 25px}
.route{font:900 31px ui-monospace,SFMono-Regular,Menlo,monospace;color:#0d2340}
.route span{color:#1467e8;padding:0 10px}
.price{text-align:right;color:#ff5a36;font-size:59px;font-weight:950;letter-spacing:-.07em}
.price small{font-size:21px;letter-spacing:-.02em}
.flights{display:grid;grid-template-columns:1fr 1fr;border-top:2px dashed #cbdcf1}
.flight{padding:24px 31px}
.flight+.flight{border-left:1px solid #d8e4f1}
.flight small{color:#71869d;font:800 14px ui-monospace,SFMono-Regular,Menlo,monospace}
.flight strong{display:block;margin:8px 0 5px;font-size:24px}
.flight span{font-size:16px;color:#4c647d}
.pill{display:inline-block;margin-top:25px;padding:10px 15px;border-radius:99px;background:#ffd43b;font-weight:900;font-size:17px}
.foot{position:absolute;left:64px;right:64px;bottom:45px;display:flex;justify-content:space-between;align-items:center;color:#71869d;font-size:16px}
.next{font-weight:900;color:#1467e8}
</style>
<div class="head"><div class="brand"><img class="logo" src="../assets/profile.png" alt=""><span>싸다에어</span></div><div class="seq">HIROSHIMA · 001</div></div>
<div class="kicker">오늘의 출국가</div>
<h1 class="destination">인천 ↔ 히로시마</h1>
<section class="date-ticket">
  <div class="year">TRAVEL DATES · 2026</div>
  <div class="dates"><span>11.30</span><span class="arrow">→</span><span>12.09</span></div>
  <div class="duration"><strong>9박 10일</strong><span>월요일 출발 · 수요일 귀국</span></div>
</section>
<section class="ticket">
  <div class="fare"><div class="route">ICN <span>✈</span> HIJ</div><div class="price">221,900<small>원 · 왕복</small></div></div>
  <div class="flights"><div class="flight"><small>OUTBOUND · 11.30</small><strong>07:45 → 09:30</strong><span>ICN → HIJ · 1시간 45분</span></div><div class="flight"><small>RETURN · 12.09</small><strong>10:30 → 12:20</strong><span>HIJ → ICN · 1시간 50분</span></div></div>
</section>
<span class="pill">제주항공 · 직항 · 성인 1명</span>
<div class="foot"><span>날짜를 먼저 보고, 실제 동선을 확인하세요</span><span class="next">일정 보기 1/4 →</span></div>
